name: Apply Ruvon Icon Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-icon-fix-runner.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: run icon asset fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Extract supplied icon source
        run: |
          awk '/^UklGR/{flag=1} /^ICON_B64$/{flag=0} flag' .github/workflows/apply-icon-fix.yml > /tmp/ruvon.b64
          base64 -d /tmp/ruvon.b64 > /tmp/ruvon.webp
          test "$(stat -c%s /tmp/ruvon.webp)" -eq 22164

      - name: Apply exact artwork and round icon mask
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import shutil, re

          root = Path('.')
          src_path = Path('/tmp/ruvon.webp')
          src = Image.open(src_path).convert('RGB')
          assert src.size == (512, 512)

          # High-resolution in-app artwork from the user's supplied icon.
          shutil.copyfile(src_path, root / 'app/src/main/res/drawable-nodpi/ic_ruvon_app.webp')

          # Leave ic_launcher untouched. Only ic_launcher_round gets a circular boundary.
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for density, size in sizes.items():
              folder = root / f'app/src/main/res/mipmap-{density}'
              hi_size = size * 4
              hi = src.resize((hi_size, hi_size), Image.Resampling.LANCZOS).convert('RGBA')
              mask = Image.new('L', (hi_size, hi_size), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, hi_size - 1, hi_size - 1), fill=255)
              rounded = Image.new('RGBA', (hi_size, hi_size), (0, 0, 0, 0))
              rounded.paste(hi, (0, 0), mask)
              rounded = rounded.resize((size, size), Image.Resampling.LANCZOS)
              if density in {'mdpi', 'hdpi', 'xhdpi'}:
                  rounded.save(folder / 'ic_launcher_round.png', 'PNG', optimize=True)
              else:
                  rounded.save(folder / 'ic_launcher_round.webp', 'WEBP', lossless=True, method=6)

          brand = root / 'app/src/main/java/com/example/ui/components/AppBrandLogo.kt'
          brand.write_text('''package com.example.ui.components

import androidx.compose.foundation.Image
import androidx.compose.foundation.layout.size
import androidx.compose.runtime.Composable
import androidx.compose.ui.Modifier
import androidx.compose.ui.layout.ContentScale
import androidx.compose.ui.res.painterResource
import androidx.compose.ui.unit.Dp
import androidx.compose.ui.unit.dp
import com.example.R

/** Displays the supplied Ruvon artwork directly, without masks, crops or visual effects. */
@Suppress("UNUSED_PARAMETER")
@Composable
fun AppBrandLogo(
    modifier: Modifier = Modifier,
    size: Dp = 40.dp,
    showContainer: Boolean = false,
    showGlow: Boolean = false,
    contentDescription: String? = "Ruvon VPN Logo"
) {
    Image(
        painter = painterResource(id = R.drawable.ic_ruvon_app),
        contentDescription = contentDescription,
        contentScale = ContentScale.Fit,
        modifier = modifier.size(size)
    )
}
''', encoding='utf-8')

          splash = root / 'app/src/main/java/com/example/ui/components/AppSplashScreen.kt'
          text = splash.read_text(encoding='utf-8')
          if 'import androidx.compose.ui.layout.ContentScale' not in text:
              text = text.replace('import androidx.compose.ui.graphics.Color\n', 'import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.layout.ContentScale\n')
          pattern = re.compile(r'\n\s*// Main Animated Shield Icon container.*?\n\s*Spacer\(modifier = Modifier\.height\(28\.dp\)\)', re.S)
          replacement = '''
            // Original supplied icon, with no crop, rounded container, border or overlay.
            Image(
                painter = painterResource(id = R.drawable.ic_ruvon_app),
                contentDescription = "Ruvon VPN Icon",
                contentScale = ContentScale.Fit,
                modifier = Modifier
                    .size(130.dp)
                    .scale(scale.value)
                    .alpha(alpha.value)
            )

            Spacer(modifier = Modifier.height(28.dp))'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise RuntimeError('Splash icon block not found')
          splash.write_text(text, encoding='utf-8')

          onboarding = root / 'app/src/main/java/com/example/ui/components/OnboardingTourScreen.kt'
          text = onboarding.read_text(encoding='utf-8')
          if 'import androidx.compose.ui.layout.ContentScale' not in text:
              text = text.replace('import androidx.compose.ui.graphics.Color\n', 'import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.layout.ContentScale\n')
          pattern = re.compile(r'\n\s*// Shield Emblem with Dark Container & Cyan/Blue Glow.*?\n\s*Spacer\(modifier = Modifier\.height\(24\.dp\)\)', re.S)
          replacement = '''
                // Original supplied icon, displayed directly without any visual alteration.
                Image(
                    painter = painterResource(id = R.drawable.ic_ruvon_app),
                    contentDescription = "Ruvon VPN Icon",
                    contentScale = ContentScale.Fit,
                    modifier = Modifier.size(116.dp)
                )

                Spacer(modifier = Modifier.height(24.dp))'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise RuntimeError('Onboarding icon block not found')
          onboarding.write_text(text, encoding='utf-8')
          PY

      - name: Commit to main
        run: |
          git config user.name 'Ahmedsamra96'
          git config user.email '88600156+Ahmedsamra96@users.noreply.github.com'
          git add app/src/main/res/drawable-nodpi/ic_ruvon_app.webp app/src/main/res/mipmap-*/ic_launcher_round.* app/src/main/java/com/example/ui/components/AppBrandLogo.kt app/src/main/java/com/example/ui/components/AppSplashScreen.kt app/src/main/java/com/example/ui/components/OnboardingTourScreen.kt
          git commit -m 'fix: preserve original icon and round only roundIcon assets'
          git push origin HEAD:main
