name: Apply Ruvon Icon Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-icon-fix-runner.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Restore supplied icon source
        run: awk '/^UklGR/{flag=1} /^ICON_B64$/{flag=0} flag' .github/workflows/apply-icon-fix.yml | base64 -d > /tmp/ruvon.webp

      - name: Verify supplied icon source
        run: test "$(stat -c%s /tmp/ruvon.webp)" -eq 22164

      - name: Apply exact icon treatment
        run: python scripts/apply_ruvon_icon_fix.py /tmp/ruvon.webp

      - name: Commit final icon changes and remove temporary helpers
        run: |
          git config user.name 'Ahmedsamra96'
          git config user.email '88600156+Ahmedsamra96@users.noreply.github.com'
          git add app/src/main/res/drawable-nodpi/ic_ruvon_app.webp
          git add app/src/main/res/mipmap-*/ic_launcher_round.*
          git add app/src/main/java/com/example/ui/components/AppBrandLogo.kt
          git add app/src/main/java/com/example/ui/components/AppSplashScreen.kt
          git add app/src/main/java/com/example/ui/components/OnboardingTourScreen.kt
          git rm .github/workflows/apply-icon-fix.yml .github/workflows/apply-icon-fix-runner.yml scripts/apply_ruvon_icon_fix.py
          git commit -m 'fix: preserve original icon and round only roundIcon assets'
          git push origin HEAD:main
