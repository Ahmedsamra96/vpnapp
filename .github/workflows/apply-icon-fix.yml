name: Apply exact Ruvon icon assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-icon-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: apply exact icon assets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install pillow
      - name: Restore exact icon source
        shell: bash
        run: |
          cat > /tmp/ruvon.b64 <<'ICON_B64'

ICON_B64
          base64 -d /tmp/ruvon.b64 > /tmp/ruvon.webp
          test "$(stat -c%s /tmp/ruvon.webp)" -eq 22164

      - name: Apply icon assets and exact in-app rendering
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import shutil, re

          root = Path('.')
          src_path = Path('/tmp/ruvon.webp')
          src = Image.open(src_path).convert('RGB')
          assert src.size == (512, 512)

          # In-app asset: same supplied artwork, high-resolution, no mask/effects/crop.
          in_app = root / 'app/src/main/res/drawable-nodpi/ic_ruvon_app.webp'
          shutil.copyfile(src_path, in_app)

          # Only roundIcon resources get a circular mask. Regular launcher icons stay untouched.
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for density, size in sizes.items():
              folder = root / f'app/src/main/res/mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              scale = 4
              hi_size = size * scale
              hi = src.resize((hi_size, hi_size), Image.Resampling.LANCZOS).convert('RGBA')
              mask = Image.new('L', (hi_size, hi_size), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, hi_size - 1, hi_size - 1), fill=255)
              out = Image.new('RGBA', (hi_size, hi_size), (0, 0, 0, 0))
              out.paste(hi, (0, 0), mask)
              out = out.resize((size, size), Image.Resampling.LANCZOS)
              if density in {'mdpi', 'hdpi', 'xhdpi'}:
                  out.save(folder / 'ic_launcher_round.png', 'PNG', optimize=True)
              else:
                  out.save(folder / 'ic_launcher_round.webp', 'WEBP', lossless=True, method=6)

          # Brand logo component: render the source image itself only. Keep API parameters for existing callers.
          brand = root / 'app/src/main/java/com/example/ui/components/AppBrandLogo.kt'
          brand.write_text('''package com.example.ui.components

import androidx.compose.foundation.Image
import androidx.compose.foundation.layout.size
import androidx.compose.runtime.Composable
import androidx.compose.ui.Modifier
import androidx.compose.ui.layout.ContentScale
import androidx.compose.ui.res.painterResource
import androidx.compose.ui.unit.Dp
import androidx.compose.ui.unit.dp
import com.example.R

/** Renders the supplied Ruvon artwork exactly as an image, without extra clipping or styling. */
@Suppress("UNUSED_PARAMETER")
@Composable
fun AppBrandLogo(
    modifier: Modifier = Modifier,
    size: Dp = 40.dp,
    showContainer: Boolean = false,
    showGlow: Boolean = false,
    contentDescription: String? = "Ruvon VPN Logo"
) {
    Image(
        painter = painterResource(id = R.drawable.ic_ruvon_app),
        contentDescription = contentDescription,
        contentScale = ContentScale.Fit,
        modifier = modifier.size(size)
    )
}
''', encoding='utf-8')

          # Splash: remove the decorative container around the icon; keep the page animation/background.
          splash = root / 'app/src/main/java/com/example/ui/components/AppSplashScreen.kt'
          s = splash.read_text(encoding='utf-8')
          if 'import androidx.compose.ui.layout.ContentScale' not in s:
              s = s.replace('import androidx.compose.ui.graphics.Color\n', 'import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.layout.ContentScale\n')
          pattern = re.compile(r'\n\s*// Main Animated Shield Icon container.*?\n\s*Spacer\(modifier = Modifier\.height\(28\.dp\)\)', re.S)
          repl = '''
            // Supplied app artwork, displayed directly with no crop, mask, border, or extra container.
            Image(
                painter = painterResource(id = R.drawable.ic_ruvon_app),
                contentDescription = "Ruvon VPN Icon",
                contentScale = ContentScale.Fit,
                modifier = Modifier
                    .size(130.dp)
                    .scale(scale.value)
                    .alpha(alpha.value)
            )

            Spacer(modifier = Modifier.height(28.dp))'''
          s, count = pattern.subn(repl, s, count=1)
          if count != 1:
              raise RuntimeError('Splash icon block not found')
          splash.write_text(s, encoding='utf-8')

          # Onboarding: same direct image treatment.
          onboarding = root / 'app/src/main/java/com/example/ui/components/OnboardingTourScreen.kt'
          s = onboarding.read_text(encoding='utf-8')
          if 'import androidx.compose.ui.layout.ContentScale' not in s:
              s = s.replace('import androidx.compose.ui.graphics.Color\n', 'import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.layout.ContentScale\n')
          pattern = re.compile(r'\n\s*// Shield Emblem with Dark Container & Cyan/Blue Glow.*?\n\s*Spacer\(modifier = Modifier\.height\(24\.dp\)\)', re.S)
          repl = '''
                // Supplied app artwork, displayed directly with no crop, mask, border, or extra container.
                Image(
                    painter = painterResource(id = R.drawable.ic_ruvon_app),
                    contentDescription = "Ruvon VPN Icon",
                    contentScale = ContentScale.Fit,
                    modifier = Modifier.size(116.dp)
                )

                Spacer(modifier = Modifier.height(24.dp))'''
          s, count = pattern.subn(repl, s, count=1)
          if count != 1:
              raise RuntimeError('Onboarding icon block not found')
          onboarding.write_text(s, encoding='utf-8')
          PY

      - name: Commit icon fix to main
        shell: bash
        run: |
          git config user.name 'Ahmedsamra96'
          git config user.email '88600156+Ahmedsamra96@users.noreply.github.com'
          git add app/src/main/res/drawable-nodpi/ic_ruvon_app.webp \
                  app/src/main/res/mipmap-*/ic_launcher_round.* \
                  app/src/main/java/com/example/ui/components/AppBrandLogo.kt \
                  app/src/main/java/com/example/ui/components/AppSplashScreen.kt \
                  app/src/main/java/com/example/ui/components/OnboardingTourScreen.kt
          git commit -m 'fix: preserve original icon and round only roundIcon assets'
          git push origin HEAD:main
